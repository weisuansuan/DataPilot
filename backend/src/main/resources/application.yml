spring:
  application:
    name: datapilot
  datasource:
    url: jdbc:mysql://${DATAPILOT_DB_HOST:127.0.0.1}:${DATAPILOT_DB_PORT:3307}/${DATAPILOT_DB_NAME:datapilot}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true
    username: ${DATAPILOT_DB_READ_USER:datapilot_reader}
    password: ${DATAPILOT_DB_READ_PASSWORD:}
    hikari:
      read-only: true
      maximum-pool-size: 8
      connection-timeout: 3000
      initialization-fail-timeout: -1
  ai:
    model:
      chat: none
      embedding: none
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
datapilot:
  query:
    timeout-seconds: ${DATAPILOT_QUERY_TIMEOUT_SECONDS:5}
    max-concurrency: ${DATAPILOT_QUERY_MAX_CONCURRENCY:4}
    max-plan-cost: ${DATAPILOT_QUERY_MAX_PLAN_COST:10000000}
  ai:
    provider: ${DATAPILOT_AI_PROVIDER:qiniu}
    base-url: ${DATAPILOT_AI_BASE_URL:https://api.qnaigc.com/v1}
    model: ${DATAPILOT_AI_MODEL:qiniu/conatus-free}
    api-key: ${QINIU_API_KEY:}
    stream: ${DATAPILOT_AI_STREAM:true}
    timeout-seconds: ${DATAPILOT_AI_TIMEOUT_SECONDS:45}
    max-output-tokens: ${DATAPILOT_AI_MAX_OUTPUT_TOKENS:1200}
    max-prompt-chars: ${DATAPILOT_AI_MAX_PROMPT_CHARS:12000}
    max-repair-attempts: ${DATAPILOT_AI_MAX_REPAIR_ATTEMPTS:2}
    max-concurrency: ${DATAPILOT_AI_MAX_CONCURRENCY:2}
    max-provider-retries: ${DATAPILOT_AI_MAX_PROVIDER_RETRIES:1}
    max-retry-delay-seconds: ${DATAPILOT_AI_MAX_RETRY_DELAY_SECONDS:5}

server:
  address: 127.0.0.1
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.datapilot: INFO
